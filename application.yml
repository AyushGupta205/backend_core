spring:
  application:
    name: backend-core
  
  datasource:
    url: jdbc:postgresql://localhost:5432/virality_db
    username: virality_user
    password: virality_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.virality: DEBUG
    org.springframework.data.redis: DEBUG
